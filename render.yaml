services:
  - type: web
    name: algoforge4-web
    runtime: python
    plan: free
    region: singapore
    repo: https://github.com/opmok772008/algoforge4.0
    branch: main
    buildCommand: "pip install -r requirements.txt && python -m pytest -q"
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
