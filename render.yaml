services:
  - type: web
    name: algoforge4-web
    runtime: python
    plan: free
    region: singapore
    repo: https://github.com/opmok772008/algoforge5.0
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
